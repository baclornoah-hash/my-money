<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindCal</title>

<style>

:root{
    --baby:#bfe8f5;
    --baby2:#eaf8fc;
    --navy:#102a43;
    --navy2:#243b53;
    --white:#ffffff;
    --gray:#627d98;
    --border:#d7e8ef;
    --green:#4caf7a;
    --red:#d9534f;
    --priority-must:#e5484d;
    --priority-could:#f2b705;
    --priority-none:#c4d1dc;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--baby2);
    color:var(--navy);
}

/* HEADER */

header{
    background:var(--navy);
    color:white;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    opacity:.75;
}

header button{
    border:0;
    background:var(--baby);
    color:var(--navy);
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */

.container{
    width:94%;
    max-width:1300px;
    margin:25px auto;
}

.layout{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    box-shadow:0 8px 25px rgba(16,42,67,.08);
}

/* CALENDAR */

.calendar-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.calendar-top h2{
    margin:0;
}

.nav button{
    border:0;
    background:var(--baby);
    color:var(--navy);
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.weekdays,
.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
}

.weekday{
    text-align:center;
    font-size:12px;
    font-weight:bold;
    color:var(--gray);
    padding:8px 0;
}

.day{
    min-height:105px;
    border:1px solid var(--border);
    padding:6px;
    cursor:pointer;
    background:white;
    touch-action:none;
    user-select:none;
}

.day:hover{
    background:var(--baby2);
}

.day.today{
    background:#f0fbfe;
}

.day.selected{
    outline:3px solid var(--baby);
}

.day.drag-range{
    background:var(--baby);
    outline:2px dashed var(--navy);
    outline-offset:-2px;
}

.day-number{
    font-weight:bold;
    font-size:13px;
    margin-bottom:5px;
}

.event{
    font-size:10px;
    padding:4px;
    margin:3px 0;
    border-radius:5px;
    background:var(--baby);
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.event.completed{
    text-decoration:line-through;
    opacity:.5;
}

.event.cancelled{
    text-decoration:line-through;
    opacity:.35;
}

.event.priority-must{
    border-left:3px solid var(--priority-must);
}

.event.priority-could{
    border-left:3px solid var(--priority-could);
}

.event.priority-none{
    border-left:3px solid var(--priority-none);
}

/* ADD BUTTON */

.add-event{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:var(--navy);
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:18px;
}

.add-event:hover{
    background:var(--navy2);
}

/* EVENTS */

.event-card{
    background:#f6fbfd;
    border:1px solid var(--border);
    border-left:4px solid var(--priority-none);
    padding:12px;
    border-radius:11px;
    margin-bottom:10px;
}

.event-card.priority-must{
    border-left-color:var(--priority-must);
}

.event-card.priority-could{
    border-left-color:var(--priority-could);
}

.event-card.priority-none{
    border-left-color:var(--priority-none);
}

.priority-badge{
    display:inline-block;
    font-size:11px;
    font-weight:bold;
    padding:2px 8px;
    border-radius:20px;
    background:var(--baby2);
    margin-bottom:6px;
}

.event-card h4{
    margin:0 0 5px;
}

.event-info{
    font-size:12px;
    color:var(--gray);
    margin-bottom:8px;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

    .edit{
    background:#dceffc;
    color:var(--navy);
}
    
.actions button{
    border:0;
    border-radius:7px;
    padding:6px 9px;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.complete{
    background:#ddf5e8;
    color:#217346;
}

.move{
    background:var(--baby);
    color:var(--navy);
}

.cancel{
    background:#fff0ef;
    color:var(--red);
}

.delete{
    background:#eeeeee;
}

/* BRAIN DUMP */

textarea{
    width:100%;
    min-height:130px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
}

.save-dump{
    border:0;
    background:var(--baby);
    color:var(--navy);
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.message{
    font-size:12px;
    color:var(--green);
    margin-top:7px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(16,42,67,.55);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:18px;
    padding:22px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    margin-top:0;
}

.close{
    border:0;
    background:none;
    font-size:28px;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    margin-bottom:10px;
}

.full{
    grid-column:1 / -1;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:white;
}

textarea{
    font-family:Arial,sans-serif;
}

.save-event{
    width:100%;
    border:0;
    background:var(--navy);
    color:white;
    padding:14px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.audio-preview{
    width:100%;
    margin-top:8px;
}

.empty{
    text-align:center;
    color:var(--gray);
    padding:20px;
    font-size:13px;
}

/* MOBILE */

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

}

@media(max-width:550px){

    header{
        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .day{
        min-height:70px;
    }

    .event{
        font-size:9px;
    }

}

    .day-selector{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.day-option{
    display:flex;
    align-items:center;
    gap:5px;
    background:var(--baby2);
    border:1px solid var(--border);
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
}

.day-option input{
    width:auto;
}


/* WEEK VIEW */

.view-switcher{
    display:flex;
    gap:6px;
    margin-bottom:15px;
}

.view-button{
    border:1px solid var(--border);
    background:white;
    color:var(--navy);
    padding:8px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.view-button.active{
    background:var(--navy);
    color:white;
}

    /* WEEKLY CALENDAR */

.week-calendar{
    display:grid;
    grid-template-columns:70px repeat(7, 1fr);
    border:1px solid var(--border);
    overflow-x:auto;
}

.week-time{
    min-height:60px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:8px;
    font-size:11px;
    color:var(--gray);
    background:#f8fcfd;
}

.week-day-header{
    min-height:55px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:8px;
    text-align:center;
    font-size:12px;
    font-weight:bold;
    background:var(--baby2);
}

.week-cell{
    min-height:60px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:3px;
    cursor:pointer;
    background:white;
    touch-action:none;
    user-select:none;
}

.week-cell:hover{
    background:var(--baby2);
}

.week-cell.drag-range{
    background:var(--baby);
    outline:2px dashed var(--navy);
    outline-offset:-2px;
}

.week-event{
    background:var(--baby);
    border-radius:6px;
    padding:5px;
    margin:2px 0;
    font-size:10px;
    overflow:hidden;
}

.week-event.completed{
    text-decoration:line-through;
    opacity:.5;
}

.week-event.cancelled{
    text-decoration:line-through;
    opacity:.35;
}

.week-event.priority-must{
    border-left:3px solid var(--priority-must);
}

.week-event.priority-could{
    border-left:3px solid var(--priority-could);
}

.week-event.priority-none{
    border-left:3px solid var(--priority-none);
}

/* DEDICATED (NON-HOURLY) WEEK SECTIONS */

.week-section-cell{
    min-height:34px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:4px;
    cursor:pointer;
    background:white;
}

.week-section-cell:hover{
    background:var(--baby2);
}

.week-section-group{
    margin-bottom:4px;
}

.week-section-group:last-child{
    margin-bottom:0;
}

.week-section-label{
    font-size:9px;
    font-weight:bold;
    color:var(--gray);
    text-transform:uppercase;
    letter-spacing:.3px;
    margin-bottom:2px;
}

.week-timed-divider{
    grid-column:1 / -1;
    background:var(--navy);
    color:white;
    font-size:12px;
    font-weight:bold;
    padding:8px 10px;
    letter-spacing:.3px;
}

/* DAILY VIEW */

.day-calendar{
    display:grid;
    grid-template-columns:90px 1fr;
    border:1px solid var(--border);
    overflow-x:auto;
}

/* HABIT TRACKER */

.habit-tracker{
    overflow-x:auto;
}

.habit-add-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
}

.habit-add-row input[type="text"]{
    flex:1;
    min-width:140px;
}

.habit-add-row select{
    width:auto;
}

.habit-add-row button{
    border:0;
    background:var(--navy);
    color:white;
    padding:10px 14px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

.habit-add-row button:hover{
    background:var(--navy2);
}

.habit-table{
    border-collapse:collapse;
    min-width:100%;
}

.habit-table th,
.habit-table td{
    border:1px solid var(--border);
    text-align:center;
    padding:4px;
    font-size:11px;
}

.habit-table th{
    background:var(--baby2);
    color:var(--navy);
    font-weight:bold;
    min-width:26px;
}

.habit-name-cell{
    text-align:left !important;
    white-space:nowrap;
    font-size:12px;
    font-weight:bold;
    padding:6px 10px !important;
    background:#f8fcfd;
    position:sticky;
    left:0;
    z-index:2;
}

.habit-check{
    width:22px;
    height:22px;
    border-radius:5px;
    border:1px solid var(--border);
    background:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    color:white;
    margin:0 auto;
}

.habit-check:hover{
    background:var(--baby2);
}

.habit-check.done{
    background:var(--green);
    border-color:var(--green);
}

.habit-delete{
    border:0;
    background:#fff0ef;
    color:var(--red);
    border-radius:6px;
    padding:2px 6px;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
    margin-left:8px;
}

.habit-progress-section{
    margin-top:22px;
}

.habit-progress-title{
    font-size:13px;
    font-weight:bold;
    color:var(--navy);
    margin-bottom:10px;
}

.habit-progress-chart{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:90px;
    border-bottom:1px solid var(--border);
    min-width:100%;
}

.habit-progress-bar{
    flex:1;
    background:var(--baby);
    border-radius:3px 3px 0 0;
    min-width:6px;
}

.habit-empty{
    text-align:center;
    color:var(--gray);
    padding:30px;
    font-size:13px;
}

    .smart-schedule{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:var(--baby);
    color:var(--navy);
    font-weight:bold;
    cursor:pointer;
    margin-bottom:18px;
}

.smart-schedule:hover{
    background:#a9deed;
}

    /* SMART SCHEDULING */

.smart-result{
    background:var(--baby2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
    margin-top:15px;
}

.smart-result h3{
    margin-top:0;
}

.smart-result button{
    border:0;
    background:var(--navy);
    color:white;
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.smart-result button:hover{
    background:var(--navy2);
}

.smart-time{
    font-size:20px;
    font-weight:bold;
    color:var(--navy);
    margin:8px 0;
}
    
</style>
</head>


<body>

<header>

    <div>
        <div class="logo">🧠 MindCal</div>
        <div class="subtitle">
            An ADHD-friendly calendar
        </div>
    </div>

    <button id="headerAdd">
        ＋ Add Event
    </button>

</header>


<div class="container">

<div class="layout">


<!-- CALENDAR -->

<div class="card">

    <div class="calendar-top">

    <div class="nav">
        <button id="previousMonth">‹</button>
        <button id="nextMonth">›</button>
    </div>

    <h2 id="monthTitle"></h2>

    <div class="nav">

    <button id="todayButton">
        Today
    </button>

</div>

</div>

<div class="view-switcher">

    <button id="monthViewButton" class="view-button active">
        Month
    </button>

    <button id="weekViewButton" class="view-button">
        Week
    </button>

    <button id="dayViewButton" class="view-button">
        Day
    </button>

    <button id="habitViewButton" class="view-button">
        🎯 Habits
    </button>

</div>


    <div class="weekdays" id="weekdaysRow">

        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>

    </div>


    <div id="calendar" class="calendar"></div>

    <div id="weekCalendar" class="week-calendar" style="display:none;"></div>

    <div id="dayCalendar" class="day-calendar" style="display:none;"></div>

    <div id="habitTracker" class="habit-tracker" style="display:none;"></div>

</div>


<!-- RIGHT SIDE -->

<div>


<div class="card">

    <button class="add-event" id="addEventButton">
    ＋ Add Event
</button>

<button class="smart-schedule" id="smartScheduleButton">
    ✨ Smart Schedule
</button>

    <h3 id="Title"></h3>

    <div id="eventList"></div>

</div>


<br>


<div class="card">

    <h3>🧠 Brain Dump</h3>

    <p style="font-size:12px;color:#627d98;">
        Save ideas here without turning them into calendar events.
    </p>

    <textarea
        id="brainDump"
        placeholder="New screenplay idea... website idea... something you don't want to forget..."></textarea>

    <button class="save-dump" id="saveBrainDump">
        Save Brain Dump
    </button>

    <div id="brainMessage" class="message"></div>

</div>


</div>

</div>

</div>


<!-- EVENT MODAL -->

<div class="modal" id="eventModal">

<div class="modal-box">

    <div class="modal-header">

        <h2>Add Event</h2>

        <button class="close" id="closeModal">
            ×
        </button>

    </div>


    <form id="eventForm">

        <div class="form-grid">


            <div class="form-group full">

                <label>Event Title</label>

                <input
                    id="eventTitle"
                    type="text"
                    placeholder="Example: Write screenplay"
                    required>

            </div>


            <div class="form-group">

                <label>Category</label>

                <select id="eventCategory">

                    <option>Personal</option>
                    <option>Work</option>
                    <option>Study</option>
                    <option>Writing</option>
                    <option>Coding</option>
                    <option>Exercise</option>
                    <option>Social</option>
                    <option>Chores</option>
                    <option>Health</option>
                    <option>Other</option>

                </select>

            </div>


            <div class="form-group">

                <label>Priority</label>

                <select id="eventPriority">

                    <option value="must">
                        🔴 Must Get Done
                    </option>

                    <option value="could">
                        🟡 Could Get Done Today
                    </option>

                    <option value="none" selected>
                        ⚪ Everything Else
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Start Date</label>

<input
    id="eventStartDate"
    type="date"
    required>

       <div class="form-group">

    <label>End Date</label>

    <input
        id="eventEndDate"
        type="date"
        required>

</div>         

            </div>


            <div class="form-group">

    <label>Time</label>

    <select id="timeType">

        <option value="specific">
            Specific Time
        </option>

        <option value="morning">
            🌅 Morning
        </option>

        <option value="afternoon">
            ☀️ Afternoon
        </option>

        <option value="evening">
            🌆 Evening
        </option>

        <option value="night">
            🌙 Night
        </option>

        <option value="flexible">
            🧠 Flexible / Anytime
        </option>

        <option value="all-day">
            📅 All Day
        </option>

    </select>

</div>


<div
    class="form-group"
    id="specificTimeGroup">

    <label>Start Time</label>

    <input
        id="eventStart"
        type="time">

</div>


<div
    class="form-group"
    id="endTimeGroup">

    <label>End Time</label>

    <input
        id="eventEnd"
        type="time">

</div>


            <div class="form-group full">

                <label>Description</label>

                <textarea
                    id="eventDescription"
                    placeholder="Notes, location, details..."></textarea>

            </div>


            <div class="form-group">

    <label>Repeat</label>

    <select id="eventRepeat">

        <option value="none">
            Does not repeat
        </option>

        <option value="daily">
            Every day
        </option>

        <option value="weekly">
            Every week
        </option>

        <option value="monthly">
            Every month
        </option>

        <option value="custom">
            Custom
        </option>

    </select>

</div>

            <!-- CUSTOM REPEAT OPTIONS -->

<div
    class="form-group full"
    id="customRepeatGroup"
    style="display:none;">

    <label>Repeat On</label>

    <div class="day-selector">

        <label class="day-option">
            <input
                type="checkbox"
                value="0"
                class="repeat-day">
            Sun
        </label>

        <label class="day-option">
            <input
                type="checkbox"
                value="1"
                class="repeat-day">
            Mon
        </label>

        <label class="day-option">
            <input
                type="checkbox"
                value="2"
                class="repeat-day">
            Tue
        </label>

        <label class="day-option">
            <input
                type="checkbox"
                value="3"
                class="repeat-day">
            Wed
        </label>

        <label class="day-option">
            <input
                type="checkbox"
                value="4"
                class="repeat-day">
            Thu
        </label>

        <label class="day-option">
            <input
                type="checkbox"
                value="5"
                class="repeat-day">
            Fri
        </label>

        <label class="day-option">
            <input
                type="checkbox"
                value="6"
                class="repeat-day">
            Sat
        </label>

    </div>


    <label style="margin-top:15px;">
        Ends
    </label>

    <select id="repeatEndType">

        <option value="never">
            Never
        </option>

        <option value="date">
            On a specific date
        </option>

        <option value="occurrences">
            After a number of occurrences
        </option>

    </select>

        String(

    let day =
        String(
            date.getDate()

    return `${year}-${month}-${day}`;

}

/* =========================================
   RENDER WEEKLY CALENDAR
========================================= */

function getStartOfWeek(date){

    const result = new Date(date);

    const day = result.getDay();

    // Monday = 0
    const difference = day === 0 ? -6 : 1 - day;

    result.setDate(
        result.getDate() + difference
    );

    result.setHours(0,0,0,0);

    return result;
}


function renderWeekCalendar(){

    const weekCalendar =
        document.getElementById("weekCalendar");

    weekCalendar.innerHTML = "";

    const weekStart =
        getStartOfWeek(selectedDate);


    /* TIME COLUMN HEADER */

    const emptyHeader =
        document.createElement("div");

    emptyHeader.className =
        "week-day-header";

    emptyHeader.textContent =
        "";

    weekCalendar.appendChild(
        emptyHeader
    );


    /* MONDAY → SUNDAY HEADERS */

    for(let i = 0; i < 7; i++){

        const date =
            new Date(weekStart);

        date.setDate(
            weekStart.getDate() + i
        );


        const header =
            document.createElement("div");

        header.className =
            "week-day-header";


        header.innerHTML = `
            ${date.toLocaleDateString(
                undefined,
                { weekday:"short" }
            )}
            <br>
            ${date.getDate()}
        `;


        weekCalendar.appendChild(
            header
        );

    }


    /* =====================================
       DEDICATED SECTIONS
       (All Day, Anytime, Morning,
       Afternoon, Evening, Night)
    ===================================== */

    const sectionGroups = [

        { key:"morning",  label:"🌅 Morning" },
        { key:"afternoon",label:"☀️ Afternoon" },
        { key:"evening",  label:"🌆 Evening" },
        { key:"night",    label:"🌙 Night" },
        { key:"flexible", label:"🧠 Anytime" },
        { key:"all-day",  label:"📅 All Day" }

    ];


    const sectionLabel =
        document.createElement("div");

    sectionLabel.className =
        "week-time";

    sectionLabel.textContent =
        "";

    weekCalendar.appendChild(
        sectionLabel
    );


    for(let day = 0; day < 7; day++){

        const date =
            new Date(weekStart);

        date.setDate(
            weekStart.getDate() + day
        );


        const dateKey =
            getDateKey(date);


        const dayEvents =
            getEventsForDate(dateKey);


        const sectionCell =
            document.createElement("div");

        sectionCell.className =
            "week-section-cell";


        sectionGroups.forEach(
            function(group){

                const groupEvents =
                    dayEvents.filter(
                        function(event){

                            return event.timeType ===
                                group.key;

                        }
                    );


                if(groupEvents.length === 0){

                    return;

                }


                groupEvents.sort(
                    function(a,b){

                        return getPriorityRank(a) -
                            getPriorityRank(b);

                    }
                );


                const groupBox =
                    document.createElement("div");

                groupBox.className =
                    "week-section-group";


                const groupLabel =
                    document.createElement("div");

                groupLabel.className =
                    "week-section-label";

                groupLabel.textContent =

                groupBox.appendChild(
                    groupLabel

                groupEvents.forEach(
                    function(event){

                        const item =
                            document.createElement("div");

                        item.className =
                            "week-event priority-" +
                            (event.priority || "none");


                        if(
                            event.status ===
                            "completed"

                            item.classList.add(
                                "completed"
                            );

                        }


                        if(
                            event.status ===
                            "cancelled"
                        ){

                            item.classList.add(
                                "cancelled"
                            );

                        }


                        item.textContent =
                            event.title;

                        groupBox.appendChild(
                            item
                        );

                    }
                );


                sectionCell.appendChild(
                    groupBox
                );

            }
        );


        sectionCell.addEventListener(
            "click",
            function(){

                selectedDate =
                    new Date(date);

                renderCalendar();

                renderEvents();

                renderWeekCalendar();
                renderDayCalendar();

            }
        );


        weekCalendar.appendChild(
            sectionCell
        );

    }


    /* TIMED EVENTS DIVIDER */

    const timedDivider =
        document.createElement("div");

    timedDivider.className =
        "week-timed-divider";

    timedDivider.textContent =
        "🕐 Timed Events";

    weekCalendar.appendChild(
        timedDivider
    );


    /* HOURS */

    for(let hour = 0; hour < 24; hour++){

        /* TIME LABEL */

        const time =
            document.createElement("div");

        time.className =
            "week-time";

        const displayHour =
            hour === 0
                ? 12
                : hour > 12
                    ? hour - 12
                    : hour;

        const period =
            hour < 12 ? "AM" : "PM";

        time.textContent =
            `${displayHour} ${period}`;


        weekCalendar.appendChild(
            time
        );


        /* MONDAY → SUNDAY CELLS */

        for(let day = 0; day < 7; day++){

            const date =
                new Date(weekStart);

            date.setDate(
                weekStart.getDate() + day
            );


            const cell =
                document.createElement("div");

            cell.className =
                "week-cell";


            const dateKey =
                getDateKey(date);


            cell.dataset.date =
                dateKey;

            cell.dataset.hour =
                hour;


            /* EVENTS FOR THIS DAY */

            const dayEvents =
                getEventsForDate(dateKey);


            dayEvents.forEach(
                function(event){

                    /*
                       Only show specific-time
                       events in the hourly grid —
                       Morning/Afternoon/Evening/
                       Night/Anytime/All Day events
                       live in their own dedicated
                       sections above.
                    */

                    if(
                        event.timeType !== "specific" ||
                        !event.start
                    ){

                        return;

                    }


                    const eventHour =
                        Number(
                            event.start
                                .split(":")[0]
                        );


                    if(eventHour !== hour){

                        return;

                    }


                    const eventElement =
                        document.createElement(
                            "div"
                        );

                    eventElement.className =
                        "week-event priority-" +
                        (event.priority || "none");


                    if(
                        event.status ===
                        "completed"
                    ){

                        eventElement.classList.add(
                            "completed"
                        );

                    }


                    if(
                        event.status ===
                        "cancelled"
                    ){

                        eventElement.classList.add(
                            "cancelled"
                        );

                    }


                    eventElement.textContent =
                        event.title;


                    cell.appendChild(
                        eventElement
                    );

                }
            );


            /* CLICK / DRAG HOUR */

            cell.addEventListener(
                "pointerdown",
                function(e){

                    startHourDrag(
                        dateKey,
                        hour,
                        false
                    );

                }
            );


            weekCalendar.appendChild(
                cell
            );

        }

    }

}

        function(habit){

            const row =
                document.createElement("tr");


            const nameCell =
                document.createElement("td");

            nameCell.className =
                "habit-name-cell";

            nameCell.innerHTML =
                escapeHTML(habit.emoji) +
                " " +
                escapeHTML(habit.name);


            const deleteBtn =
                document.createElement("button");

            deleteBtn.className =
                "habit-delete";

            deleteBtn.textContent =
                "✕";

            deleteBtn.addEventListener(
                "click",
                function(){

                    if(
                        confirm(
                            "Delete habit \"" +
                            habit.name +
                            "\"? This also removes its history."
                        )
                    ){

                        habits =
                            habits.filter(
                                function(h){
                                    return h.id !== habit.id;
                                }
                            );

                        delete habitLog[habit.id];

                        saveHabits();
                        saveHabitLog();

                        renderHabitTracker();

                    }

                }
            );

            nameCell.appendChild(
                deleteBtn
            );

            row.appendChild(
                nameCell
            );


            for(
                let day = 1;
                day <= daysInMonth;
                day++
            ){

                const dateKey =
                    getDateKey(
                        new Date(year, month, day)
                    );

                const cell =
                    document.createElement("td");

                const check =
                    document.createElement("div");

                check.className =
                    "habit-check";


                const isDone =
                    !!(
                        habitLog[habit.id] &&
                        habitLog[habit.id][dateKey]
                    );

                if(isDone){

                    check.classList.add(
                        "done"
                    );

                    check.textContent =
                        "✓";

                }


                check.addEventListener(
                    "click",
                    function(){

                        if(!habitLog[habit.id]){

                            habitLog[habit.id] = {};

                        }

                        habitLog[habit.id][dateKey] =
                            !habitLog[habit.id][dateKey];

                        saveHabitLog();

                        renderHabitTracker();

                    }
                );


                cell.appendChild(
                    check
                );

                row.appendChild(
                    cell
                );

            }

            tbody.appendChild(
                row
            );

        }
    );

    table.appendChild(
        tbody
    );

    habitTracker.appendChild(
        table
    );


    /* DAILY PROGRESS CHART */

    const progressSection =
        document.createElement("div");

    progressSection.className =
        "habit-progress-section";

    const progressTitle =
        document.createElement("div");

    progressTitle.className =
        "habit-progress-title";

    progressTitle.textContent =
        "📊 Daily Progress";

    progressSection.appendChild(
        progressTitle
    );


    const chart =
        document.createElement("div");

    chart.className =
        "habit-progress-chart";


    for(
        let day = 1;
        day <= daysInMonth;
        day++
    ){

        const dateKey =
            getDateKey(
                new Date(year, month, day)
            );

        let doneCount = 0;

        habits.forEach(
            function(habit){

                if(
                    habitLog[habit.id] &&
                    habitLog[habit.id][dateKey]
                ){

                    doneCount++;

                }

            }
        );

        const percent =
            habits.length
            ? Math.round(
                (doneCount / habits.length) * 100
              )
            : 0;

        const bar =
            document.createElement("div");

        bar.className =
            "habit-progress-bar";

        bar.style.height =
            Math.max(percent, 2) + "%";

        bar.title =
            "Day " + day + ": " + percent + "%";

        chart.appendChild(
            bar
        );

    }

    progressSection.appendChild(
        chart
    );

    habitTracker.appendChild(
        progressSection
    );

}

/* =========================================
   GET EVENTS
========================================= */

function getEventsForDate(date){

    return events.filter(function(event){

        const current =
            new Date(date + "T00:00:00");

        const start =
            new Date(
                event.startDate + "T00:00:00"
            );

        const end =
            new Date(
                (event.endDate || event.startDate) +
                "T00:00:00"
            );


        /* =========================
           ORIGINAL EVENT DATE RANGE
        ========================= */

        if(
            current >= start &&
            current <= end
        ){

            return true;

        }


        /* =========================
           NO REPEAT
        ========================= */

        if(event.repeat === "none"){

            return false;

        }


        /* =========================
           BEFORE START DATE
        ========================= */

        if(current < start){

            return false;

        }


        /* =========================
           DAILY
        ========================= */

        if(event.repeat === "daily"){

            return true;

        }


        /* =========================
           WEEKLY
        ========================= */

        if(event.repeat === "weekly"){

            const difference =
                Math.floor(
                    (current - start) / 86400000
                );

            return difference % 7 === 0;

        }


        /* =========================
           MONTHLY
        ========================= */

        if(event.repeat === "monthly"){

            return (
                current.getDate() ===
                start.getDate()
            );

        }


        /* =========================
           CUSTOM
        ========================= */

        if(event.repeat === "custom"){

            if(!event.customRepeat){
                return false;
            }

            const settings =
                event.customRepeat;


            /* Check  weekday */

            if(
                !settings.days ||
                !settings.days.includes(
                    current.getDay()
                )
            ){

                return false;

            }


            /* =========================
               END DATE
            ========================= */

            if(
                settings.endType === "date" &&
                settings.endDate
            ){

                const endDate =
                    new Date(
                        settings.endDate +
                        "T00:00:00"
                    );

                if(current > endDate){
                    return false;
                }

            }


            /* =========================
               OCCURRENCES
            ========================= */

            if(
                settings.endType ===
                "occurrences" &&
                settings.occurrences
            ){

                const occurrences =
                    Number(
                        settings.occurrences
                    );

                let count = 0;

                const temp =
                    new Date(start);

                while(temp <= current){

                    if(
                        settings.days.includes(
                            temp.getDay()
                        )
                    ){

                        count++;

                    }

                    temp.setDate(
                        temp.getDate() + 1
                    );

                }

                if(count > occurrences){
                    return false;
                }

            }


            return true;

        }


        return false;

    });

}

/* =========================================
   PRIORITY HELPERS
========================================= */

function getPriorityRank(event){

    if(event.priority === "must"){
        return 0;
    }

    if(event.priority === "could"){
        return 1;
    }

    return 2;

}


function getPriorityLabel(priority){

    if(priority === "must"){
        return "🔴 Must Get Done";
    }

    if(priority === "could"){
        return "🟡 Could Get Done Today";
    }

    return "⚪ Everything Else";

}


function renderEvents(){

    const key =
    getDateKey(selectedDate);

    document.getElementById(
        "Title"
    ).textContent =
        selectedDate.toLocaleDateString(
            undefined,
            {
                weekday:"long",
                month:"long",
                day:"numeric",
                year:"numeric"
            }
        );


    const list =
        document.getElementById(
            "eventList"
        );


    list.innerHTML = "";


    const dayEvents =
        getEventsForDate(key);


    /* Automatic prioritization: Must Get Done
       first, then Could Get Done, then
       everything else. Ties keep their
       original relative order. */

    dayEvents.sort(function(a,b){

        return getPriorityRank(a) - getPriorityRank(b);

    });


    if(
        dayEvents.length === 0
    ){

        list.innerHTML =
            `<div class="empty">
                No events scheduled.
            </div>`;

        return;

    }


    dayEvents.forEach(
        function(event){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "event-card priority-" +
                (event.priority || "none");


            let time = "";

            if(event.start){

                time += event.start;

            }

            if(event.end){

                time +=
                    " – " +
                    event.end;

            }


            card.innerHTML = `

                <div class="priority-badge">
                    ${getPriorityLabel(event.priority)}
                </div>

                <h4>
                    ${escapeHTML(event.title)}
                </h4>

                <div class="event-info">

                    ${escapeHTML(event.category)}

                    ${time ? " · " + time : ""}

                </div>

                ${
                    event.description
                    ?
                    `<div style="
                        font-size:13px;
                        margin-bottom:8px;
                    ">
                        ${escapeHTML(
                            event.description
                        )}
                    </div>`
                    :
                    ""
                }


                <div class="actions">

<button
    class="edit"
    data-id="${event.id}"
    data-action="edit">

    ✏️ Edit

</button>

                    <button
                        class="complete"
                        data-id="${event.id}"
                        data-action="complete">

                        ✓ Complete

                    </button>


                    <button
                        class="move"
                        data-id="${event.id}"
                        data-action="move">

                        ↪ Move

                    </button>


                    <button
                        class="cancel"
                        data-id="${event.id}"
                        data-action="cancel">

                        ✕ Cancel

                    </button>


                    <button
                        class="delete"
                        data-id="${event.id}"
                        data-action="delete">

                        🗑 Delete

                    </button>

                </div>
            `;


            list.appendChild(card);

        }
    );

}

document
.getElementById("eventList")
.addEventListener(
    "click",
    function(e){

        const button =
            e.target.closest("button");


        if(!button) return;


        const id =
            button.dataset.id;


        const action =
            button.dataset.action;


        const event =
            events.find(
                function(item){
                    return item.id === id;
                }
            );


        if(!event) return;

        if(action === "edit"){

            openEditModal(event);

            return;

        }

        if(
            action ===
            "complete"
        ){

            event.status =
                "completed";

        }


        if(
            action ===
            "cancel"
        ){

            event.status =
                "cancelled";

        }


        if(
            action ===
            "delete"
        ){

            if(
                confirm(
                    "Delete this event permanently?"
                )
            ){

                events =
                    events.filter(
                        function(item){
                            return item.id !== id;
                        }
                    );

            }

        }


        if(action === "move"){

            const newDate =
                prompt(
                    "Move event to date:\n\nYYYY-MM-DD",
                    event.startDate
                );

            if(newDate){

                event.startDate = newDate;
                event.endDate = newDate;

            }

        }


        saveEvents();

        renderCalendar();

        renderEvents();

        renderWeekCalendar();
        renderDayCalendar();

    }
);

/* =========================================
   DRAG TO SCHEDULE
   (multi-day drag in Month View,
   multi-hour drag in Week/Day View)

   Uses classic mouse events (mousedown /
   mouseenter / mouseup) for desktop and
   classic touch events (touchstart /
   touchmove / touchend) for mobile,
   rather than the Pointer Events API,
   for the widest possible compatibility.
========================================= */

let isDragging = false;

let dragType = null;
/* "date" for month view, "hour" for week/day view */

let dragStartInfo = null;
let dragEndInfo = null;
let dragMoved = false;


function startDateDrag(dateKey){

    isDragging = true;

    dragType = "date";

    dragMoved = false;

    dragStartInfo = { dateKey: dateKey };
    dragEndInfo = { dateKey: dateKey };

    updateDateDragHighlight();

}


function extendDateDrag(dateKey){

    if(!isDragging || dragType !== "date"){

        return;

    }

    if(dateKey !== dragEndInfo.dateKey){

        dragMoved = true;

    }

    dragEndInfo = { dateKey: dateKey };

    updateDateDragHighlight();

}


function startHourDrag(dateKey, hour, quickAddOnClick){

    isDragging = true;

    dragType = "hour";

    dragMoved = false;

    dragStartInfo = {
        dateKey: dateKey,
        hour: hour,
        quickAddOnClick: quickAddOnClick
    };

    dragEndInfo = {
        dateKey: dateKey,
        hour: hour
    };

    updateHourDragHighlight();

}


function extendHourDrag(dateKey, hour){

    if(!isDragging || dragType !== "hour"){

        return;

    }

    if(dateKey !== dragStartInfo.dateKey){

        return;

    }

    if(hour !== dragEndInfo.hour){

        dragMoved = true;

    }

    dragEndInfo = {
        dateKey: dateKey,
        hour: hour
    };

    updateHourDragHighlight();

}


function updateDateDragHighlight(){

    const keys =
        [
            dragStartInfo.dateKey,
            dragEndInfo.dateKey
        ].sort();


    document
    .querySelectorAll("#calendar .day")
    .forEach(function(cellEl){

        const key =
            cellEl.dataset.date;

        if(
            key >= keys[0] &&
            key <= keys[1]
        ){

            cellEl.classList.add(
                "drag-range"
            );

        }else{

            cellEl.classList.remove(
                "drag-range"
            );

        }

    });

}


function clearDateDragHighlight(){

    document
    .querySelectorAll(
        "#calendar .day.drag-range"
    )
    .forEach(function(cellEl){

        cellEl.classList.remove(
            "drag-range"
        );

    });

}


function updateHourDragHighlight(){

    const hours =
        [
            dragStartInfo.hour,
            dragEndInfo.hour
        ].sort(function(a,b){
            return a - b;
        });


    document
    .querySelectorAll(".week-cell[data-hour]")
    .forEach(function(cellEl){

        const sameDay =
            cellEl.dataset.date ===
            dragStartInfo.dateKey;

        const hour =
            Number(cellEl.dataset.hour);

        if(
            sameDay &&
            hour >= hours[0] &&
            hour <= hours[1]
        ){

            cellEl.classList.add(
                "drag-range"
            );

        }else{

            cellEl.classList.remove(
                "drag-range"
            );

        }

    });

}


function clearHourDragHighlight(){

    document
    .querySelectorAll(
        ".week-cell.drag-range"
    )
    .forEach(function(cellEl){

        cellEl.classList.remove(
            "drag-range"
        );

    });

}


/* MOUSE: track cursor movement across cells
   via elementFromPoint, mirroring the touch
   handling below (this was previously
   missing, which is why dragging didn't
   extend the selection for mouse users). */

document.addEventListener(
    "mousemove",
    function(e){

        if(!isDragging) return;


        const target =
            document.elementFromPoint(
                e.clientX,
                e.clientY
            );

        if(!target) return;


        if(dragType === "date"){

            const cellEl =
                target.closest(
                    "#calendar .day"
                );

            if(
                cellEl &&
                cellEl.dataset.date
            ){

                extendDateDrag(
                    cellEl.dataset.date
                );

            }

        }


        if(dragType === "hour"){

            const cellEl =
                target.closest(
                    ".week-cell[data-hour]"
                );

            if(
                cellEl &&
                cellEl.dataset.date
            ){

                extendHourDrag(
                    cellEl.dataset.date,
                    Number(cellEl.dataset.hour)
                );

            }

        }

    }
);


/* TOUCH: track finger movement across
   cells via elementFromPoint, since touch
   doesn't fire mouseenter/mouseover on
   cells other than the one it started on. */

document.addEventListener(
    "touchmove",
    function(e){

        if(!isDragging) return;

        const touch =
            e.touches[0];

        if(!touch) return;


        const target =
            document.elementFromPoint(
                touch.clientX,
                touch.clientY
            );

        if(!target) return;


        if(dragType === "date"){

            const cellEl =
                target.closest(
                    "#calendar .day"
                );

            if(
                cellEl &&
                cellEl.dataset.date
            ){

                extendDateDrag(
                    cellEl.dataset.date
                );

            }

        }


        if(dragType === "hour"){

            const cellEl =
                target.closest(
                    ".week-cell[data-hour]"
                );

            if(
                cellEl &&
                cellEl.dataset.date
            ){

                extendHourDrag(
                    cellEl.dataset.date,
                    Number(cellEl.dataset.hour)
                );

            }

        }


        /* Prevent the page from scrolling
           while dragging across cells. */

        e.preventDefault();

    },
    { passive: false }
);


function finishDrag(){

    if(!isDragging) return;

    isDragging = false;


    if(dragType === "date"){

        clearDateDragHighlight();

        finishDateDrag();

    }


    if(dragType === "hour"){

        clearHourDragHighlight();

        finishHourDrag();

    }


    dragType = null;
    dragStartInfo = null;
    dragEndInfo = null;

}


document.addEventListener(
    "mouseup",
    finishDrag
);


document.addEventListener(
    "touchend",
    finishDrag
);


document.addEventListener(
    "touchcancel",
    finishDrag
);


function finishDateDrag(){

    const keys =
        [
            dragStartInfo.dateKey,
            dragEndInfo.dateKey
        ].sort();


    if(!dragMoved){

        /* Plain click — select this day,
           same as the old behavior. */

        selectedDate =
            new Date(
                keys[0] + "T00:00:00"
            );

        renderCalendar();
        renderEvents();
        renderWeekCalendar();
        renderDayCalendar();

        return;

    }


    /* Real drag across multiple days —
       open Add Event prefilled with the
       dragged date range. */

    openModal();

    document.getElementById(
        "eventStartDate"
    ).value =
        keys[0];

    document.getElementById(
        "eventEndDate"
    ).value =
        keys[1];

}


function finishHourDrag(){

    const hours =
        [
            dragStartInfo.hour,
            dragEndInfo.hour
        ].sort(function(a,b){
            return a - b;
        });


    if(
        !dragMoved &&
        !dragStartInfo.quickAddOnClick
    ){

        /* Plain click in Week View —
           select this day, same as the
           old behavior. */

        selectedDate =
            new Date(
                dragStartInfo.dateKey +
                "T00:00:00"
            );

        renderCalendar();
        renderEvents();
        renderWeekCalendar();
        renderDayCalendar();

        return;

    }


    /* Real drag, or a quick click in
       Day View — open Add Event prefilled
       with the time range. A plain click
       defaults to a 1-hour block. */

    const endHour =
        Math.min(
            hours[1] + 1,
            24
        );

    openModal();

    document.getElementById(
        "eventStartDate"
    ).value =
        dragStartInfo.dateKey;

    document.getElementById(
        "eventEndDate"
    ).value =
        dragStartInfo.dateKey;

    document.getElementById(
        "timeType"
    ).value =
        "specific";

    updateTimeFields();

    document.getElementById(
        "eventStart"
    ).value =
        String(hours[0]).padStart(2,"0") +
        ":00";

    document.getElementById(
        "eventEnd"
    ).value =
        endHour === 24
        ? "23:59"
        : String(endHour).padStart(2,"0") +
            ":00";

}

/* =========================================
   FIND AVAILABLE TIME
========================================= */

function findAvailableTime(
    date,
    duration,
    preference
){

    const dayEvents =
        getEventsForDate(date);


    const busyTimes = [];


    /* Get existing timed events */

    dayEvents.forEach(function(event){

        if(!event.start){
            return;
        }


        const startParts =
            event.start.split(":");


        const start =
            Number(startParts[0]) * 60 +
            Number(startParts[1]);


        let end;


        if(event.end){

            const endParts =
                event.end.split(":");


            end =
                Number(endParts[0]) * 60 +
                Number(endParts[1]);

        }else{

            /* No end time = assume 1 hour */

            end =
                start + 60;

        }


        busyTimes.push({
            start:start,
            end:end
        });

    });


    /* Sort events by starting time */

    busyTimes.sort(function(a,b){

        return a.start - b.start;

    });


    /* =====================================
       CHOOSE TIME WINDOW
    ===================================== */

    let windowStart = 8 * 60;
    let windowEnd = 22 * 60;


    if(preference === "morning"){

        windowStart = 6 * 60;
        windowEnd = 12 * 60;

    }


    if(preference === "afternoon"){

        windowStart = 12 * 60;
        windowEnd = 17 * 60;

    }


    if(preference === "evening"){

        windowStart = 17 * 60;
        windowEnd = 21 * 60;

    }


    if(preference === "night"){

        windowStart = 20 * 60;
        windowEnd = 23 * 60;

    }


    /* =====================================
       SEARCH FOR FREE TIME
    ===================================== */

    let possibleTime =
        windowStart;


    for(
        let i = 0;
        i <= busyTimes.length;
        i++
    ){

        const nextBusy =
            busyTimes[i];


        const availableEnd =
            nextBusy
            ? nextBusy.start
            : windowEnd;


        /* Is there enough free time? */

        if(
            availableEnd -
            possibleTime
            >= duration
        ){

            return {

                start:
                    possibleTime,

                end:
                    possibleTime + duration

            };

        }


        /* Move past the existing event */

        if(nextBusy){

            possibleTime =
                Math.max(
                    possibleTime,
                    nextBusy.end
                );

        }

    }


    return null;

}


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(minutes){

    let hour =
        Math.floor(minutes / 60);

    let minute =
        minutes % 60;


    const period =
        hour >= 12
        ? "PM"
        : "AM";


    let displayHour =
        hour % 12;


    if(displayHour === 0){

        displayHour = 12;

    }


    return (
        displayHour +
        ":" +
        String(minute).padStart(2,"0") +
        " " +
        period
    );

}
